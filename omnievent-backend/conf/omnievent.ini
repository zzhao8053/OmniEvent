[global]
app_name = OmniEvent
mode = release

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 8080
domain = localhost
root_url =
static_root_path =
enable_gzip = false
log_request = true
request_id_header = X-Request-ID

[database]
type = postgres
host = localhost
port = 5432
user = postgres
password = postgres
dbname = omnievent
sslmode = disable
max_idle_conns = 10
max_open_conns = 100
conn_max_lifetime = 3600
log_query = false
auto_update_database = true

[redis]
host = localhost
port = 6379
password =
db = 0
pool_size = 10

[jwt]
secret =
expire_hours = 24
refresh_days = 7
max_tokens_per_user = 5

[security]
secret_key =
token_expire_seconds = 86400
max_failures_per_ip_per_minute = 60
enable_rate_limiting = true

[user]
enable_register = true
min_username_length = 3
max_username_length = 32
min_password_length = 6
max_password_length = 128
